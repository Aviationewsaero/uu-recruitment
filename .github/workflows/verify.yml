name: Verify

# This repo holds the University of Uttarakhand recruitment drive — real
# candidate records — and deployed to production on every push with no check
# in front of it.
#
# There are no tests here yet, so typecheck and lint are the gate. Both block.
#
# Lint was advisory for exactly one day: the tree carried 23 ESLint errors, and
# a gate that is red on the day it ships teaches everyone to ignore red. Those
# 23 are now fixed, so the step blocks — which is the only state in which it
# does anything.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      # postinstall runs `prisma generate`, which reads the schema and does not
      # connect — no DATABASE_URL is needed here, and none should be given.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint
